- id: radio_basic
  category: radio
  description: Single-select with standard other-specify / none-of-above rows
  input: |
    Q1. Dummy SR Question
    Option 1   1
    Option 2   2
    Option 3   3
    Other (please specify)   91
    None of the above   99
  expected:
    element: radio
    comment_tag: "${res.SR}"
    rows:
      - {label: r1, value: "1", text: "Option 1"}
      - {label: r2, value: "2", text: "Option 2"}
      - {label: r3, value: "3", text: "Option 3"}
      - {label: r91, value: "91", open: true, text: "Other (please specify)"}
      - {label: r99, value: "99", randomize_off: true, text: "None of the above"}

- id: checkbox_basic
  category: checkbox
  description: Multi-select, no value attribute on rows (per template convention)
  input: |
    Q2. Dummy MR Question
    Option 1
    Option 2
    Option 3
    Other (please specify)
    None of the above
  expected:
    element: checkbox
    comment_tag: "${res.MR}"
    atleast: "1"
    rows:
      - {label: r1, text: "Option 1"}
      - {label: r2, text: "Option 2"}
      - {label: r3, text: "Option 3"}
      - {label: r91, open: true, text: "Other (please specify)"}
      - {label: r99, exclusive: true, text: "None of the above"}

- id: checkbox_grid_basic
  category: checkbox_grid
  description: Clean multi-select grid, rows and cols, no cardsort styling
  input: |
    Q3. Which of the following do you use for each activity? Please
    select all that apply.
    MR PER ROW
    Email | Text message | Phone call
    Booking a service         1
    Getting a quote           2
    Following up an enquiry   3
  expected:
    element: checkbox_grid
    comment_tag: "${res.MRStatement}"
    atleast: "1"
    rows:
      - {text: "Booking a service", code: "1"}
      - {text: "Getting a quote", code: "2"}
      - {text: "Following up an enquiry", code: "3"}
    cols:
      - {text: "Email"}
      - {text: "Text message"}
      - {text: "Phone call"}

