- id: multiselect_with_routing
  category: checkbox
  description: Multi-select with a routing tag that must be excluded from output
  input: |
    Do you have a current Tasmanian driver's licence for a car?
    ASK ALL, MC
    Yes  1
    No - but I intend to get one within the next 12 months  2
    No  3
