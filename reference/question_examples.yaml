- id: programmer_instruction_derived_variable
  category: not_a_question
  description: Bracketed instruction to derive a banded variable — not respondent-facing
  input: |
    [Please create the following variable for datafile and auto code
    based on S2 Age]:
    S2_AGE BANDS
    Under 18 years  1
    18 to 24 years  2
  expected:
    element: not_a_question
    reason: "Programmer instruction to derive a variable, not respondent-facing"

- id: type_signal_as_table_header
  category: radio
  description: SR/MR appears as an options-table column header, not a routing line
  input: |
    S1. What gender do you identify as?
                        SR
    Male                1
    Female              2
    Non-binary          3
    Prefer not to say   99
  expected:
    element: radio
    comment_tag: "${res.SR}"

- id: two_table_grid
  category: radio_grid
  description: Grid built from two separate tables — scale/cols in one, statements/rows in another
  input: |
    P1. For each statement below, please tell us how strongly you agree
    or disagree that Australia Post...
    SR PER ROW
    Strongly Disagree | Disagree | Neither | Agree | Strongly Agree
    1                  | 2        | 3       | 4     | 5
    Randomise
    Delivers parcels quickly              1
    Delivers parcels on time              2
    Is affordable for sending parcels     3
  expected:
    element: radio_grid
    rows:
      - {text: "Delivers parcels quickly", code: "1"}
      - {text: "Delivers parcels on time", code: "2"}
      - {text: "Is affordable for sending parcels", code: "3"}
    cols:
      - {text: "Strongly Disagree", code: "1"}
      - {text: "Disagree", code: "2"}
      - {text: "Neither", code: "3"}
      - {text: "Agree", code: "4"}
      - {text: "Strongly Agree", code: "5"}

- id: per_row_routing_column
  category: radio
  description: A third table column carries a routing directive for specific rows only
  input: |
    D5A. TERMINATE IF UNDER 18 OR 70+
    HIDDEN VARIABLE CLASSIFICATION
    17 or younger    1    TERMINATE
    18-24            2
    ...
    70 or older      12   TERMINATE
  expected:
    element: radio
    options:
      - {text: "17 or younger", code: "1", row_note: "TERMINATE"}
      - {text: "18-24", code: "2"}
      - {text: "70 or older", code: "12", row_note: "TERMINATE"}

- id: missing_code_on_one_option
  category: radio
  description: Not every option has an explicit code, even when others in the same table do
  input: |
    D6. Are you...
    SR
    Male     1
    Female   2
    Other
  expected:
    element: radio
    options:
      - {text: "Male", code: "1"}
      - {text: "Female", code: "2"}
      - {text: "Other", code: null}   # falls back to sequential numbering

- id: non_sequential_codes_preserved
  category: radio_grid
  description: Codes must be preserved exactly, gaps and all (retired rows from earlier waves)
  input: |
    Offers unique and thoughtful gifts    17
    Has Post Offices that provide the products and services I need   18
  expected:
    element: radio_grid
    rows:
      - {text: "Offers unique and thoughtful gifts", code: "17"}
      - {text: "Has Post Offices that provide the products and services I need", code: "18"}
    note: "Codes 15-16 intentionally absent (retired in an earlier wave) — must not be renumbered"

- id: piped_text_in_title
  category: text
  description: Dynamic piped text inside a question title must be preserved verbatim
  input: |
    P3. Why do you disagree that Australia Post is [PIPE CODE FROM P2]?
  expected:
    element: text
    title: "Why do you disagree that Australia Post is [PIPE CODE FROM P2]?"

- id: strikethrough_excluded
  category: excluded
  description: Struck-through (deleted/deprecated) content must not be converted at all
  input: |
    ~~MP2. When you buy from marketplace platforms like Temu or Shein,
    how important is are each of the following in your decision making?~~
    ~~Low prices / getting the most for my money    1~~
  expected:
    element: null
    excluded: true
    reason: "Strikethrough formatting indicates deleted/deprecated content"

- id: custom_complex_quiz
  category: custom_complex
  description: Gamified task too complex for any standard element type
  input: |
    Click on all the images that you recognise the brand that it belongs
    to -- as quickly as you can -- and then click 'next'. [5 levels,
    8 images each, scoring, asset randomization from external sheet]
  expected:
    element: custom_complex
    reason: "Multi-level gamified image-recognition task with external
      asset randomization — requires manual custom scripting"

- id: custom_complex_video_slider
  category: custom_complex
  description: Real-time slider synced to video playback
  input: |
    We will provide you with a slider underneath the video which you can
    move left and right as the video plays to show how positive or
    negative you feel at different points.
  expected:
    element: custom_complex
    reason: "Continuous real-time input synced to video playback —
      requires manual custom scripting"

